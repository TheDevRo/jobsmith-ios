name: TestFlight

# Manual only: archive JobsmithStandalone and upload it to TestFlight.
# Mirrors scripts/testflight-upload.sh.example, but reads the App Store Connect
# API key from repo secrets (ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID, TEAM_ID).
# The key needs the Admin role so cloud signing can create the distribution cert.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (blank = 1000 + workflow run number)"
        required: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # The app uses iOS 26 APIs, so it needs the newest Xcode on the image.
      - name: Select the newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          for v in ASC_KEY_P8 ASC_KEY_ID; do
            [ -n "${!v}" ] || { echo "Missing repo secret $v"; exit 1; }
          done
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          BUILD_INPUT: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          BUILD="${BUILD_INPUT:-$((1000 + RUN_NUMBER))}"
          for v in ASC_ISSUER_ID TEAM_ID; do
            [ -n "${!v}" ] || { echo "Missing repo secret $v"; exit 1; }
          done
          echo "Build number: $BUILD"
          mkdir -p build
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>destination</key><string>upload</string>
              <key>teamID</key><string>${TEAM_ID}</string>
              <key>signingStyle</key><string>automatic</string>
              <key>uploadSymbols</key><true/>
              <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$ASC_KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive \
            -project JobsmithStandalone.xcodeproj \
            -scheme JobsmithStandalone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/JobsmithStandalone.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            "${AUTH[@]}"
          xcodebuild -exportArchive \
            -archivePath build/JobsmithStandalone.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            "${AUTH[@]}"
          echo "Uploaded build $BUILD. It shows in App Store Connect > TestFlight in about 15-60 minutes."
      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
